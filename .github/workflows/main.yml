name: Build Internet Speed Check APK AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check Android Project
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 4 -type f | sort
          echo "========================="

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Clean Project
        run: ./gradlew clean

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Show Build Files
        run: |
          echo "===== APK ====="
          find . -type f -name "*.apk" -print

          echo "===== AAB ====="
          find . -type f -name "*.aab" -print

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Internet-Speed-Check-APK
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v6
        with:
          name: Internet-Speed-Check-AAB
          path: |
            **/build/outputs/bundle/release/*.aab
          if-no-files-found: error              implementation 'androidx.appcompat:appcompat:1.7.1'
              implementation 'com.google.android.material:material:1.13.0'
              implementation 'androidx.activity:activity:1.10.1'
              implementation 'androidx.core:core-ktx:1.16.0'
          }
          EOF

          cat > app/proguard-rules.pro <<'EOF'
          # No custom ProGuard rules.
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Internet Speed Check</string>
          </resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
          </resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.InternetSpeedCheck"
                  parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:statusBarColor">@color/black</item>
                  <item name="android:navigationBarColor">@color/black</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@drawable/app_logo"
                  android:roundIcon="@drawable/app_logo"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.InternetSpeedCheck">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/drawable/app_logo.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#101820"
                  android:pathData="M0,0h108v108h-108z" />

              <path
                  android:fillColor="#4DA3FF"
                  android:pathData="M54,18a36,36 0,1 0,0 72a36,36 0,1 0,0 -72" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,55h14l8,-16 9,30 10,-21 7,13h16v8H67l-4,-8 -10,23 -10,-31 -2,10H24z" />

          </vector>
          EOF

          cat > app/src/main/java/com/gxdl/internetspeedcheck/MainActivity.java <<'EOF'
          package com.gxdl.internetspeedcheck;

          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(32, 32, 32, 32);

                  TextView title = new TextView(this);
                  title.setText("Internet Speed Check");
                  title.setTextSize(28);
                  title.setGravity(Gravity.CENTER);

                  TextView status = new TextView(this);
                  status.setText(
                      "\nInternet Speed Check\n\n" +
                      "Ready to check your connection."
                  );
                  status.setTextSize(18);
                  status.setGravity(Gravity.CENTER);

                  layout.addView(title);
                  layout.addView(status);

                  setContentView(layout);
              }
          }
          EOF

      - name: Create Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build APK
        run: ./gradlew clean assembleRelease --no-daemon

      - name: Build AAB
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Internet-Speed-Check-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Internet-Speed-Check-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
