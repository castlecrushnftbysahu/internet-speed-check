name: Internet Speed Check - Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.7"

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v6

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 3. Install Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # 4. Check project files
      - name: Check Project
        run: |
          echo "=============================="
          echo " INTERNET SPEED CHECK PROJECT "
          echo "=============================="
          echo ""
          echo "Project files:"
          find . -maxdepth 5 -type f | sort
          echo ""
          echo "Gradle version:"
          gradle --version

      # 5. Check Android project
      - name: Check Android Files
        run: |
          if [ ! -d "app" ]; then
            echo "ERROR: app folder not found."
            echo "Please upload the Android app project."
            exit 1
          fi

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: root build.gradle not found."
            exit 1
          fi

          echo "Android project structure OK."

      # 6. Clean previous builds
      - name: Clean
        run: |
          gradle clean --no-daemon

      # 7. Build Release APK
      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      # 8. Build Release AAB
      - name: Build Release AAB
        run: |
          gradle bundleRelease --no-daemon --stacktrace

      # 9. Find generated APK/AAB
      - name: Find Build Outputs
        run: |
          echo "=============================="
          echo " APK FILES "
          echo "=============================="
          find . -type f -name "*.apk" -print

          echo ""
          echo "=============================="
          echo " AAB FILES "
          echo "=============================="
          find . -type f -name "*.aab" -print

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Internet-Speed-Check-APK
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 11. Upload AAB
      - name: Upload AAB
        uses: actions/upload-artifact@v6
        with:
          name: Internet-Speed-Check-AAB
          path: |
            **/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # 12. Build summary
      - name: Build Summary
        if: success()
        run: |
          echo "======================================"
          echo "       BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "Internet Speed Check APK and AAB"
          echo "have been generated successfully."
          echo ""
          echo "APK:"
          find . -type f -name "*.apk" -print
          echo ""
          echo "AAB:"
          find . -type f -name "*.aab" -print
